<!DOCTYPE html>
<html>
  <head>
    <base href="/">
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rotcart konfigurator" />
    <meta name="theme-color" content="#0175C2" />
    <title>Rotcart konfigurator</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      body {
        margin: 0;
        background: #0b1220;
        color: white;
        font-family: Arial, sans-serif;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 18px;
        font-weight: 600;
        z-index: 9999;
      }
      #loading.hidden {
        display: none;
      }
      #error {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.95);
        z-index: 10000;
        padding: 20px;
      }
      #error.show {
        display: flex;
      }
      #error-content {
        max-width: 600px;
        background: #1a1a1a;
        border: 1px solid #ff6b6b;
        border-radius: 8px;
        padding: 24px;
      }
      #error h2 {
        color: #ff6b6b;
        margin-top: 0;
      }
      #error pre {
        background: #0a0a0a;
        padding: 12px;
        border-radius: 4px;
        overflow-x: auto;
        max-height: 400px;
        font-size: 12px;
      }
      .spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(255,255,255,.28);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading app...</span>
    </div>
    
    <div id="error">
      <div id="error-content">
        <h2>⚠️ Error Loading App</h2>
        <pre id="error-message"></pre>
        <p style="margin: 0; font-size: 12px; color: #aaa;">Check browser console for details</p>
      </div>
    </div>

    <script>
      // Capture all logs
      const logs = [];
      const originalLog = console.log;
      const originalError = console.error;
      
      function addLog(level, ...args) {
        const msg = args.map(a => typeof a === 'string' ? a : JSON.stringify(a, null, 2)).join(' ');
        logs.push(`[${level}] ${msg}`);
        originalLog(`[${level}]`, ...args);
      }
      
      console.log = (...args) => addLog('LOG', ...args);
      console.error = (...args) => addLog('ERROR', ...args);
      console.warn = (...args) => addLog('WARN', ...args);
      
      function showError(title, error) {
        const errorDiv = document.getElementById('error');
        const errorMsg = document.getElementById('error-message');
        const loadingDiv = document.getElementById('loading');
        
        loadingDiv.classList.add('hidden');
        errorDiv.classList.add('show');
        
        const errorText = typeof error === 'string' ? error : (error?.message || error?.toString() || 'Unknown error');
        errorMsg.textContent = title + '\n\n' + errorText + '\n\n--- Console Log ---\n' + logs.join('\n');
      }
      
      // Set up global error handlers
      window.addEventListener('error', function(e) {
        addLog('GLOBAL_ERROR', `${e.filename}:${e.lineno}`, e.message, e.error);
        if (e.message && e.message.includes('_flutter')) {
          showError('Flutter Loader Error', e.error || e.message);
        }
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        addLog('UNHANDLED_REJECTION', e.reason);
        showError('Unhandled Promise Rejection', e.reason);
      });
      
      // Set up global Flutter configuration before loading flutter.js
      window._flutter = window._flutter || {};
      window._flutter.buildConfig = {
        "builds": [
          {
            "compileTarget": "dart2js",
            "mainJsPath": "main.dart.js",
            "renderer": "canvaskit"
          }
        ]
      };
      
      addLog('LOG', 'Flutter config initialized');
    </script>

    <script src="flutter.js" defer></script>
    <script defer>
      addLog('LOG', 'Boot script executing, _flutter.loader =', typeof window._flutter?.loader);
      
      async function initApp() {
        try {
          addLog('LOG', 'Waiting for flutter.js to load...');
          
          // Wait for flutter loader to be ready
          let attempts = 0;
          while (!window._flutter?.loader && attempts < 50) {
            await new Promise(r => setTimeout(r, 100));
            attempts++;
          }
          
          if (!window._flutter?.loader) {
            throw new Error('flutter.js loader did not initialize after 5 seconds');
          }
          
          addLog('LOG', 'Flutter loader ready, starting app initialization');
          
          const engineInitializer = await _flutter.loader.loadEntrypoint({
            entrypointUrl: '/main.dart.js',
          });
          
          addLog('LOG', 'Engine initializer received');
          
          const appRunner = await engineInitializer.initializeEngine();
          addLog('LOG', 'Engine initialized, running app...');
          
          await appRunner.runApp();
          addLog('LOG', 'App is now running!');
          
          document.getElementById('loading').classList.add('hidden');
        } catch (error) {
          addLog('ERROR', 'App initialization failed:', error);
          showError('App Initialization Failed', error);
        }
      }
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    </script>
  </body>
</html>
